# Local development server: Factorio 2.0 headless with RCON and the opcua-io mod.
# Start with scripts/dev-server.sh, which copies the mod into .dev/ first.
services:
  factorio:
    image: factoriotools/factorio:2.0.77
    environment:
      DLC_SPACE_AGE: "${DLC_SPACE_AGE:-false}"  # set DLC_SPACE_AGE=true to test quality signals
    ports:
      - "34197:34197/udp"
      - "127.0.0.1:27015:27015/tcp"
    volumes:
      - ../.dev/factorio:/factorio
    # Healthy once RCON answers and opcua-io replies to /opc_hello. The image's
    # own `rcon` tool finds the generated password; it exits 0 even for
    # errors, so the check looks for "ok":true in the reply.
    healthcheck:
      test: ["CMD-SHELL", "rcon /opc_hello | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s   # map generation on first start can take a while
      start_interval: 2s
