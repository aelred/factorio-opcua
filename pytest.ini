[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = bridge/tests mod/tests
markers =
    integration: needs a running Factorio server with opc-io (scripts/dev-server.sh up)
filterwarnings =
    # asyncua's delete_nodes leaves a callback un-awaited; the bridge notifies subscribers itself (server.py).
    ignore:coroutine 'MonitoredItemService.datachange_callback' was never awaited:RuntimeWarning
