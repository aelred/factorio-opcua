# Example factorio-opc bridge config. Copy and edit it, then run: factorio-opc --config <file>
# Every key is optional except the RCON password (or FACTORIO_RCON_PASSWORD).

[factorio]
rcon_host = "127.0.0.1"
rcon_port = 27015
# Relative paths are resolved from this file's folder.
rcon_password_file = "rconpw"
# Seconds to wait for each reply. The game doesn't answer while it saves; the
# bridge reconnects only after 3 polls in a row time out.
rcon_timeout = 5.0

[opcua]
# Localhost only. Use opc.tcp://0.0.0.0:4840/factorio-opc/ to listen on all
# interfaces, and then also tighten security below (see docs/security.md).
endpoint = "opc.tcp://127.0.0.1:4840/factorio-opc/"
server_name = "Factorio OPC UA"
# Endpoint modes offered: none, sign, sign_encrypt. Secure modes use a
# self-signed certificate created in pki_dir (or set certificate/private_key).
security = ["none", "sign_encrypt"]
pki_dir = "~/.factorio-opc/pki"
# Access without a login: none, read or write.
anonymous = "write"

# Logins. Make a hash with: factorio-opc hash-password
# [[opcua.users]]
# name = "operator"
# password_hash = "scrypt$..."
# role = "write"     # or "read"

[bridge]
# Game polls per second, 1-30. Each poll's round trip takes about one game tick.
poll_hz = 10
# text, or json for one JSON object per line (log collectors)
log_format = "text"
