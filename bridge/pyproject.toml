[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-opc"
version = "0.5.0"
description = "OPC UA server bridging Factorio circuit networks over RCON"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["asyncua>=2.1,<3"]

[project.scripts]
factorio-opc = "factorio_opc.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["factorio_opc*"]
