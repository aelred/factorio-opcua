# Factorio 2.0 headless server + factorio-opcua bridge. See docs/docker.md.
#
#   1. docker compose up -d --wait   (first start generates the map and ./factorio/config/)
#   2. Connect an OPC UA client to opc.tcp://127.0.0.1:4840/factorio-opcua/
services:
  # Installs opcua-io from this checkout into ./factorio/mods/ on every start,
  # so the mod always matches the bridge built from the same checkout. Any
  # other copy (e.g. a release zip) is removed: Factorio refuses duplicates.
  mod:
    image: factoriotools/factorio:2.0.77
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /factorio/mods
        && rm -rf /factorio/mods/opcua-io /factorio/mods/opcua-io_*
        && cp -r /src /factorio/mods/opcua-io
    volumes:
      - ../mod/opcua-io:/src:ro
      - ./factorio:/factorio

  factorio:
    image: factoriotools/factorio:2.0.77
    restart: unless-stopped
    depends_on:
      mod:
        condition: service_completed_successfully
    environment:
      DLC_SPACE_AGE: "false"     # "true" to run with Space Age
    ports:
      - "34197:34197/udp"        # game port for players; RCON stays on the internal network
    volumes:
      - ./factorio:/factorio
    # Healthy once RCON answers and opcua-io replies to /opc_hello. The image's
    # own `rcon` tool finds the generated password; it exits 0 even for
    # errors, so the check looks for "ok":true in the reply.
    healthcheck:
      test: ["CMD-SHELL", "rcon /opc_hello | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s   # map generation on first start can take a while
      start_interval: 2s

  bridge:
    build: ../bridge
    restart: unless-stopped
    depends_on:
      factorio:
        condition: service_healthy   # RCON up and opcua-io loaded
    ports:
      # Published on this machine only. To serve the network, change this to
      # "4840:4840" AND tighten bridge.toml first (docs/security.md).
      - "127.0.0.1:4840:4840"
    volumes:
      - ./bridge.toml:/config/bridge.toml:ro
      - ./factorio/config:/factorio-config:ro   # for the generated RCON password
      - bridge-data:/data                       # server certificate

volumes:
  bridge-data:
